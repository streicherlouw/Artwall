<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slideshow · Art Wall</title><link rel="stylesheet" href="/style.css"><body data-page="slideshow"><nav><a href="/" id="portal-link" hidden>← Back to Artwall</a><a href="/player" target="_blank">Preview in this browser ↗</a></nav><div class="eyebrow">Photo collages</div><h1>Set the pace.</h1><div id="status" class="status"></div><div class="toolbar"><button data-command="start">Play on the Pi</button><button data-command="stop">Stop</button><button data-command="previous">← Previous</button><button data-command="pause">Pause</button><button data-command="resume">Resume</button><button data-command="next">Next →</button></div><div id="notice" role="status"></div><form id="settings"><div class="grid"><section><h2>Playback</h2><label>Album<select name="album" id="albums"><option value="all">All collages</option></select></label><label>Seconds per collage<input name="intervalMs" type="number" min="1" max="300" step="0.5" required></label><label>Fade duration (seconds)<input name="fadeMs" type="number" min="0" max="5" step="0.05" required></label><label class="check"><input name="shuffle" type="checkbox">Shuffle images</label><label class="check"><input name="wakeDisplay" type="checkbox">Wake the screen when playback starts</label></section><section><h2>Location overlay</h2><label class="check"><input name="showMap" type="checkbox">Show country map and location pin</label><label>Map width (% of screen)<input name="mapSize" type="number" min="5" max="25" step="1" required></label><p>Locations come from the original photos. Images without GPS show no map.</p><p>PhotoFrame and SplitFlap replace each other when started. AirPlay takes priority over both.</p></section></div><div class="toolbar"><button type="submit">Save settings</button></div></form><script src="/app.js"></script></body></html>
