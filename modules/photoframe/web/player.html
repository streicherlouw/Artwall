<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#fff;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#stage,.slide{position:fixed;inset:0}.slide{opacity:0;transition:opacity 850ms ease;pointer-events:none}.slide.visible{opacity:1}.photo{width:100%;height:100%;object-fit:contain;display:block}.location{position:absolute;right:clamp(16px,2vw,72px);bottom:clamp(16px,2vw,72px);width:clamp(120px,11vw,290px);padding:8px 12px 14px;border:1px solid #ffffff26;border-radius:18px;background:#101820b8;backdrop-filter:blur(12px);box-shadow:0 8px 30px #0004;text-align:center}.location[hidden]{display:none}.location svg{display:block;width:100%;height:auto;overflow:visible}.outline{fill:#f0f4f2;fill-opacity:.88;stroke:#fff;stroke-width:.7;fill-rule:evenodd;stroke-linejoin:round}.pin{fill:#ff7155;stroke:#fff;stroke-width:2;filter:drop-shadow(0 2px 3px #0009)}.country{font-size:clamp(12px,1vw,22px);font-weight:550;letter-spacing:.02em;overflow-wrap:anywhere}.controls{position:fixed;z-index:10;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #ffffff26;border-radius:50px;background:#101820d9;box-shadow:0 8px 32px #0004;transition:opacity .4s}.controls button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:22px}.controls button:hover,.controls button:focus-visible{background:#ffffff26;outline:2px solid #ffffff80}.controls .count{min-width:82px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:#dce2e5}body.idle .controls:not(:focus-within){opacity:0;pointer-events:none}body.idle{cursor:none}#message{position:fixed;z-index:9;left:50%;top:24px;transform:translateX(-50%);background:#101820dc;padding:10px 18px;border-radius:20px;font-size:14px}#message:empty{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){.location{bottom:100px;width:120px}.controls{bottom:16px}}@media(prefers-reduced-motion:reduce){.slide,.controls{transition:none}}
</style>
</head>
<body>
<main id="stage" aria-label="Collage slideshow">
<div class="slide" aria-hidden="true"><img class="photo" alt=""><aside class="location" hidden><svg viewBox="0 0 240 200" role="img"><title></title><path class="outline"></path><g class="pin"><path d="M0 0C-3-5-9-10-9-16a9 9 0 1 1 18 0C9-10 3-5 0 0Z"></path><circle cy="-16" r="3" fill="white" stroke="none"></circle></g></svg><div class="country"></div></aside></div>
<div class="slide" aria-hidden="true"><img class="photo" alt=""><aside class="location" hidden><svg viewBox="0 0 240 200" role="img"><title></title><path class="outline"></path><g class="pin"><path d="M0 0C-3-5-9-10-9-16a9 9 0 1 1 18 0C9-10 3-5 0 0Z"></path><circle cy="-16" r="3" fill="white" stroke="none"></circle></g></svg><div class="country"></div></aside></div>
</main>
<div id="message" role="status">Loading collage…</div>
<nav class="controls" aria-label="Slideshow controls">
<button id="previous" title="Previous collage (←)" aria-label="Previous collage">←</button>
<button id="pause" title="Pause (Space)" aria-label="Pause slideshow">Ⅱ</button>
<span class="count" id="count"></span>
<button id="next" title="Next collage (→)" aria-label="Next collage">→</button>
<button id="fullscreen" title="Fullscreen (F)" aria-label="Enter fullscreen">⛶</button>
</nav>
<p class="sr-only">Images advance every five seconds. Left and right arrows navigate. Space pauses; F toggles fullscreen. Maps use public-domain Natural Earth boundaries.</p>
<script id="slides" type="application/json">__SLIDES__</script>
<script>
'use strict';
const slides=JSON.parse(document.getElementById('slides').textContent);
const baseTitle=document.title;
const layers=[...document.querySelectorAll('.slide')],message=document.getElementById('message'),counter=document.getElementById('count');
const cache=new Map(),failed=new Set();
let current=-1,requested=0,active=0,revision=0,timer,idleTimer,paused=false;
const wrap=n=>(n%slides.length+slides.length)%slides.length;
function load(index){
  if(!cache.has(index)){
    const image=new Image();image.decoding='async';
    const ready=new Promise((resolve,reject)=>{image.onload=async()=>{try{await image.decode();resolve(image)}catch(error){reject(error)}};image.onerror=()=>reject(new Error('Image unavailable'));image.src=slides[index].src});
    cache.set(index,ready);
  }
  return cache.get(index);
}
function schedule(){clearTimeout(timer);if(!paused&&!document.hidden&&slides.length>1)timer=setTimeout(()=>navigate(1),5000)}
function wake(){document.body.classList.remove('idle');clearTimeout(idleTimer);idleTimer=setTimeout(()=>document.body.classList.add('idle'),2500)}
function updateMap(layer,slide){
  const card=layer.querySelector('.location'),map=slide.map;
  card.hidden=!map;
  if(!map)return;
  layer.querySelector('.outline').setAttribute('d',map.path);
  layer.querySelector('.pin').setAttribute('transform',`translate(${map.pinX} ${map.pinY})`);
  layer.querySelector('.country').textContent=map.country;
  layer.querySelector('title').textContent=`${map.country}: ${slide.location.latitude.toFixed(5)}, ${slide.location.longitude.toFixed(5)}`;
}
async function show(index){
  clearTimeout(timer);requested=wrap(index);const target=requested,version=++revision;
  try{
    const image=await load(target);
    if(version!==revision)return;
    const next=current<0?active:1-active,layer=layers[next],previous=layers[active];
    // The fully decoded incoming image fades over the opaque outgoing image,
    // avoiding blank frames and the dark dip of two simultaneous opacity fades.
    layer.style.transition='none';layer.classList.remove('visible');layer.style.zIndex='2';
    if(current>=0)previous.style.zIndex='1';
    layer.querySelector('.photo').src=image.src;layer.querySelector('.photo').alt=slides[target].name;
    updateMap(layer,slides[target]);layer.setAttribute('aria-hidden','false');
    void layer.offsetWidth;layer.style.transition='';layer.classList.add('visible');
    current=target;active=next;counter.textContent=`${current+1} / ${slides.length}`;
    document.title=`${current+1} / ${slides.length} · ${baseTitle}`;
    message.textContent='';
    if(previous!==layer){previous.setAttribute('aria-hidden','true');setTimeout(()=>{if(revision===version){previous.style.transition='none';previous.classList.remove('visible')}},900)}
    try{history.replaceState(null,'',`#slide=${current+1}`)}catch{}
    schedule();
    const keep=new Set([current,wrap(current+1),wrap(current-1)]);
    for(const key of cache.keys())if(!keep.has(key))cache.delete(key);
    for(const key of keep)if(key!==current&&!failed.has(key))load(key).catch(()=>{});
  }catch(error){
    if(version!==revision)return;
    failed.add(target);cache.delete(target);
    message.textContent=`Could not load ${slides[target].name}. Skipping…`;
    if(failed.size===slides.length){message.textContent='No images could be loaded. Keep this HTML file and its image folders together.';return}
    let next=wrap(target+1);while(failed.has(next))next=wrap(next+1);show(next);
  }
}
function navigate(delta){if(slides.length)show(requested+delta)}
function togglePause(){paused=!paused;const button=document.getElementById('pause');button.textContent=paused?'▶':'Ⅱ';button.setAttribute('aria-label',paused?'Resume slideshow':'Pause slideshow');button.title=paused?'Resume (Space)':'Pause (Space)';schedule();wake()}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else message.textContent='Use your browser’s fullscreen command.'}catch{message.textContent='Use your browser’s fullscreen command.'}wake()}
document.getElementById('previous').onclick=()=>{navigate(-1);wake()};
document.getElementById('next').onclick=()=>{navigate(1);wake()};
document.getElementById('pause').onclick=togglePause;document.getElementById('fullscreen').onclick=fullscreen;
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowRight'){event.preventDefault();navigate(1)}else if(event.key==='ArrowLeft'){event.preventDefault();navigate(-1)}else if(event.code==='Space'){event.preventDefault();togglePause()}else if(event.key.toLowerCase()==='f'){event.preventDefault();fullscreen()}else return;wake()});
document.addEventListener('pointermove',wake);document.addEventListener('pointerdown',wake);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else schedule()});
document.addEventListener('fullscreenchange',()=>document.getElementById('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Exit fullscreen':'Enter fullscreen'));
const initial=Number(new URLSearchParams(location.hash.slice(1)).get('slide'));
if(slides.length){show(Number.isInteger(initial)&&initial>=1&&initial<=slides.length?initial-1:0);wake()}else message.textContent='No collages in this slideshow.';
</script>
</body>
</html>
