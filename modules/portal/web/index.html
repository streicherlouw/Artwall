<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artwall</title><link rel="stylesheet" href="/style.css"><body><div class="eyebrow">Artwall · Your display</div><h1>Your display, in one place.</h1><p>Open an installed module to configure it or choose what to show.</p><main class="cards" id="services"></main><p id="notice" role="status">Loading installed modules…</p><section id="display-settings" hidden><h2>When the screen is blank</h2><form id="idle-form"><label>Turn the monitor off after (seconds)<input id="idle-seconds" name="idleTimeoutSeconds" type="number" min="0" max="3600" value="60" required></label><p>Only applies when no display module is active. Use 0 to leave the monitor on.</p><button type="submit">Save timeout</button><p id="idle-notice" role="status"></p></form></section><script src="/app.js"></script></body></html>
