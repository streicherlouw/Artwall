<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AirPlayReceiver · Art Wall</title><link rel="stylesheet" href="/style.css"><body data-page="airplay"><nav><a href="/" id="portal-link">AirPlayReceiver</a></nav><div class="eyebrow">AirPlayReceiver</div><h1>Mirror to Art Wall.</h1><p>Choose this receiver in Screen Mirroring or the AirPlay output selector on your Apple device.</p><div id="notice" role="status"></div><form id="settings"><section><label>Receiver name<input name="receiverName" maxlength="80" required></label><label>Maximum frame rate<input name="fps" type="number" min="15" max="60" required></label><label>Maximum system volume (%)<input name="systemVolumeLimitPercent" type="number" min="1" max="100" required></label><label class="check"><input name="manageSystemVolume" type="checkbox">Manage system volume during playback</label><label class="check"><input name="manageDisplayPower" type="checkbox">Wake and restore the screen for AirPlay</label><small>Saving restarts the receiver. Settings can only be applied when no AirPlay session is active.</small></section><div class="toolbar"><button type="submit">Save and restart receiver</button></div></form><script src="/app.js"></script></body></html>
